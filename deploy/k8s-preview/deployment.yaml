apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-ez-web
  labels:
    app.kubernetes.io/name: pi-ez-web
    app.kubernetes.io/part-of: selfhost
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-ez-web
  template:
    metadata:
      annotations:
        selfhost.bry-guy.net/nfs-selinux-context: container_file_t
      labels:
        app.kubernetes.io/name: pi-ez-web
        app.kubernetes.io/part-of: selfhost
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: initialize-state
          image: ghcr.io/bry-guy/pi-ez-web:preview-placeholder
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const fs = require('node:fs');
              const dirs = ['/data/pi-ez-web', '/data/pi-ez-agent', '/data/pi-ez-workspaces', '/data/pi-ez-worktrees', '/data/pi-ez-operator-home'];
              for (const dir of dirs) fs.mkdirSync(dir, { recursive: true });
              const config = '/data/pi-ez-web/config.json';
              let value = {};
              try {
                const parsed = JSON.parse(fs.readFileSync(config, 'utf8'));
                if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) value = parsed;
              } catch {}
              value.reposRoot ||= '/data/pi-ez-workspaces';
              value.worktreeRoot ||= '/data/pi-ez-worktrees';
              const pi = value.pi && typeof value.pi === 'object' && !Array.isArray(value.pi) ? value.pi : {};
              if (!pi.profile || pi.profile === 'https://github.com/bry-guy/dotfiles/blob/main/.pi/agent/settings.json') {
                pi.profile = 'https://github.com/bry-guy/dotfiles';
              }
              pi.packages = [...new Set([
                'git:github.com/nicobailon/pi-mcp-adapter',
                'git:github.com/nicobailon/pi-web-access',
                'git:github.com/lajarre/pi-vim',
                'git:github.com/bry-guy/pi-ez-worktree',
                'npm:context-mode',
                'npm:@juicesharp/rpiv-ask-user-question',
                'npm:@dietrichgebert/ponytail',
                'npm:@narumitw/pi-lsp',
                'npm:@juicesharp/rpiv-todo',
                'npm:@juicesharp/rpiv-advisor',
                'npm:@juicesharp/rpiv-btw',
                'npm:@tintinweb/pi-subagents',
                ...(Array.isArray(pi.packages) ? pi.packages : []),
              ])];
              pi.extensions = Array.isArray(pi.extensions) ? pi.extensions : [];
              value.pi = pi;
              value.projectHooks = {
                setup: 'mise trust --yes && mise install && mise run bootstrap',
                check: 'mise run check',
                ...(value.projectHooks || {}),
              };
              const projectHookSets = { ...(value.projectHookSets || {}) };
              projectHookSets.infra = {
                setup: 'mise trust --yes && mise run selfhost:tooling:init',
                check: 'mise run check',
                ...(projectHookSets.infra || {}),
              };
              delete projectHookSets.infra.deploy;
              value.projectHookSets = projectHookSets;
              if (Array.isArray(value.projects)) {
                for (const project of value.projects) {
                  if (project && typeof project === 'object') {
                    project.mode ||= 'auto';
                    if (project.name === 'pi-ez-web' || String(project.repoPath || '').endsWith('/pi-ez-web')) {
                      project.hooks ||= { setup: 'mise trust --yes && mise install && mise run bootstrap' };
                    }
                  }
                }
              }
              fs.writeFileSync(config, JSON.stringify(value, null, 2) + '\n');
          env:
            - name: PI_WEB_HOME
              value: /data/pi-ez-web
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: state
              mountPath: /data
              subPath: preview
      nodeSelector:
        selfhost.bry-guy.net/capability-service: "true"
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # Match the shared NFS volume context; NFS cannot carry per-pod MCS
        # labels, so this workload remains single-replica and tailnet-only.
        seLinuxOptions:
          level: s0
      containers:
        - name: pi-ez-web
          image: ghcr.io/bry-guy/pi-ez-web:preview-placeholder
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HOME
              value: /data/pi-ez-operator-home
            - name: XDG_CONFIG_HOME
              value: /data/pi-ez-operator-home/.config
            - name: XDG_DATA_HOME
              value: /data/pi-ez-operator-home/.local/share
            - name: XDG_CACHE_HOME
              value: /data/pi-ez-operator-home/.cache
            - name: PI_WEB_HOME
              value: /data/pi-ez-web
            - name: PI_WEB_REPOS_ROOT
              value: /data/pi-ez-workspaces
            # This is a deployment-local, public OAuth client ID. Device Flow
            # never uses the client secret; keep that only in 1Password.
            - name: PI_WEB_GITHUB_CLIENT_ID
              value: Ov23livNQSEmNhsrLEeI
            - name: PI_CODING_AGENT_DIR
              value: /data/pi-ez-agent
            - name: DOTFILES_REPOSITORY
              value: https://github.com/bry-guy/dotfiles.git
            - name: DOTFILES_REVISION
              value: 10b207c5e673b0393fca1b87ff1be3608c6fefeb
            - name: PI_WEB_PRESTART_TIMEOUT_MS
              value: "120000"
            - name: PI_WEB_PRESTART_COMMAND
              value: |
                set -eu
                : "${DOTFILES_REPOSITORY:?DOTFILES_REPOSITORY is required}"
                : "${DOTFILES_REVISION:?DOTFILES_REVISION is required}"
                if ! printf '%s\\n' "$DOTFILES_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
                  printf '%s\\n' 'DOTFILES_REVISION must be a 40-character lowercase commit.' >&2
                  exit 2
                fi
                mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
                export GIT_TERMINAL_PROMPT=0
                yadm_repo="$XDG_DATA_HOME/yadm/repo.git"
                if [ ! -d "$yadm_repo" ]; then
                  GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm clone --no-bootstrap --no-checkout "$DOTFILES_REPOSITORY"
                elif [ "$(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm remote get-url origin)" != "$DOTFILES_REPOSITORY" ]; then
                  printf '%s\\n' 'The existing yadm origin does not match DOTFILES_REPOSITORY.' >&2
                  exit 2
                fi
                if ! GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm cat-file -e "$DOTFILES_REVISION^{commit}" 2>/dev/null; then
                  GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm fetch --no-tags origin
                fi
                GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm reset --hard "$DOTFILES_REVISION"
                GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm alt
                test "$(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm rev-parse HEAD)" = "$DOTFILES_REVISION"
                unset GIT_CONFIG_GLOBAL GIT_CONFIG_NOSYSTEM
                git config --global --unset-all 'credential.https://github.com.helper' || true
                git config --global --unset-all 'credential.https://gist.github.com.helper' || true
                git config --global --unset-all 'url.ssh://git@github.com/.insteadOf' || true
                git config --global --replace-all user.name 'Bryan Smith'
                git config --global --replace-all user.email 'bryan@bry-guy.net'
                git config --global --replace-all credential.helper /usr/local/bin/pi-ez-web-git-credential-helper
            - name: PORT
              value: "3141"
            - name: PI_WEB_MODE
              value: real
            - name: MISE_ENV
              value: pi-web
            # Pi packages are explicitly selected in the profile/configuration.
            # Trust only their managed Git checkout root, not project worktrees.
            - name: MISE_TRUSTED_CONFIG_PATHS
              value: /data/pi-ez-agent/git/github.com
            - name: PI_EZ_WEB_REPO_ROOT
              value: /data/pi-ez-workspaces/pi-ez-web
            # Preview is wired to the private sync service for manual, disposable testing.
            - name: PI_SYNC_SERVER_URL
              value: http://pi-syncd.pi-sync.svc:8080
            - name: PI_WEB_SYNC_ALL_CONVERSATIONS
              value: "false"
          ports:
            - name: http
              containerPort: 3141
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: state
              mountPath: /data
              subPath: preview
      # Preview state is persistent but isolated from production. It does not
      # mount the production operator credentials or Kubernetes API access.
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: pi-ez-web-state-parent
