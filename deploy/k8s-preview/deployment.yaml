apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-ez-web
  labels:
    app.kubernetes.io/name: pi-ez-web
    app.kubernetes.io/part-of: selfhost
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-ez-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-ez-web
        app.kubernetes.io/part-of: selfhost
        selfhost.bry-guy.net/preview: "true"
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      nodeSelector:
        selfhost.bry-guy.net/capability-service: "true"
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pi-ez-web
          image: ghcr.io/bry-guy/pi-ez-web:preview-placeholder
          imagePullPolicy: IfNotPresent
          env:
            - name: PI_WEB_UI_ONLY
              value: "1"
            - name: PORT
              value: "3141"
          ports:
            - name: http
              containerPort: 3141
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ui-health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /ui-health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /ui-health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
