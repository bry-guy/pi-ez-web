apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-ez-web
  labels:
    app.kubernetes.io/name: pi-ez-web
    app.kubernetes.io/part-of: selfhost
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-ez-web
  template:
    metadata:
      annotations:
        selfhost.bry-guy.net/nfs-selinux-context: container_file_t
      labels:
        app.kubernetes.io/name: pi-ez-web
        app.kubernetes.io/part-of: selfhost
        selfhost.bry-guy.net/preview: "false"
    spec:
      automountServiceAccountToken: false
      serviceAccountName: pi-ez-web
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: initialize-state
          image: ghcr.io/bry-guy/pi-ez-web:sha-placeholder
          imagePullPolicy: IfNotPresent
          command:
            - node
            - -e
            - |
              const fs = require('node:fs');
              const config = '/data/pi-ez-web/config.json';
              function validateConfig() {
                const stats = fs.lstatSync(config);
                if (!stats.isFile()) throw new Error('config.json must be a regular file');
                const parsed = JSON.parse(fs.readFileSync(config, 'utf8'));
                if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
                  throw new Error('config.json must contain a JSON object');
                }
              }
              let missing = false;
              try {
                validateConfig();
              } catch (error) {
                if (error && error.code === 'ENOENT') missing = true;
                else throw error;
              }
              const dirs = ['/data/pi-ez-web', '/data/pi-ez-agent', '/data/pi-ez-operator-home'];
              for (const dir of dirs) fs.mkdirSync(dir, { recursive: true });
              if (missing) {
                const value = {
                  pi: {
                    profile: 'https://github.com/bry-guy/dotfiles',
                    packages: [
                      'git:github.com/nicobailon/pi-mcp-adapter',
                      'git:github.com/nicobailon/pi-web-access',
                      'git:github.com/lajarre/pi-vim',
                      'git:github.com/bry-guy/pi-ez-worktree',
                      'npm:context-mode',
                      'npm:@juicesharp/rpiv-ask-user-question',
                      'npm:@dietrichgebert/ponytail',
                      'npm:@narumitw/pi-lsp',
                      'npm:@juicesharp/rpiv-todo',
                      'npm:@juicesharp/rpiv-advisor',
                      'npm:@juicesharp/rpiv-btw',
                      'npm:@tintinweb/pi-subagents',
                    ],
                    extensions: [],
                  },
                };
                try {
                  const fd = fs.openSync(config, 'wx', 0o600);
                  try {
                    fs.writeFileSync(fd, JSON.stringify(value, null, 2) + '\n', { encoding: 'utf8' });
                  } finally {
                    fs.closeSync(fd);
                  }
                } catch (error) {
                  if (!error || error.code !== 'EEXIST') throw error;
                  validateConfig();
                  throw new Error('config.json was created concurrently');
                }
              }
          env:
            - name: PI_WEB_HOME
              value: /data/pi-ez-web
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: state
              mountPath: /data
      nodeSelector:
        selfhost.bry-guy.net/capability-service: "true"
        kubernetes.io/hostname: platform-worker-0
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # Match the shared NFS volume context; NFS cannot carry per-pod MCS
        # labels, so this workload remains single-replica and tailnet-only.
        seLinuxOptions:
          level: s0
      containers:
        - name: pi-ez-web
          image: ghcr.io/bry-guy/pi-ez-web:sha-placeholder
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: HOME
              value: /data/pi-ez-operator-home
            - name: XDG_CONFIG_HOME
              value: /data/pi-ez-operator-home/.config
            - name: XDG_DATA_HOME
              value: /data/pi-ez-operator-home/.local/share
            - name: XDG_CACHE_HOME
              value: /data/pi-ez-operator-home/.cache
            - name: PI_WEB_HOME
              value: /data/pi-ez-web
            # This is a deployment-local, public OAuth client ID. Device Flow
            # never uses the client secret; keep that only in 1Password.
            - name: PI_WEB_GITHUB_CLIENT_ID
              value: Ov23livNQSEmNhsrLEeI
            - name: PI_CODING_AGENT_DIR
              value: /data/pi-ez-agent
            - name: DOTFILES_REPOSITORY
              value: https://github.com/bry-guy/dotfiles.git
            - name: PI_WEB_PRESTART_TIMEOUT_MS
              value: "120000"
            - name: PI_WEB_PRESTART_COMMAND
              value: |
                set -eu
                : "${DOTFILES_REPOSITORY:?DOTFILES_REPOSITORY is required}"
                mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
                export GIT_TERMINAL_PROMPT=0
                yadm_repo="$XDG_DATA_HOME/yadm/repo.git"
                if [ -d "$yadm_repo" ]; then
                  if ! GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm rev-parse --git-dir >/dev/null 2>&1; then
                    rm -rf "$yadm_repo"
                  elif ! origin="$(GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm remote get-url origin 2>/dev/null)"; then
                    rm -rf "$yadm_repo"
                  elif [ "$origin" != "$DOTFILES_REPOSITORY" ]; then
                    printf '%s\n' 'The existing yadm origin does not match DOTFILES_REPOSITORY.' >&2
                    exit 2
                  fi
                fi
                # Always the latest dotfiles. A first start waits for them; later starts
                # update in the background and new chats pick the update up.
                if [ ! -d "$yadm_repo" ]; then
                  GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm clone --no-bootstrap --no-checkout "$DOTFILES_REPOSITORY"
                  GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm fetch --no-tags origin HEAD && GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm reset --hard FETCH_HEAD && GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm alt
                else
                  ( GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm fetch --no-tags origin HEAD && GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm reset --hard FETCH_HEAD && GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 yadm alt ) >/dev/null 2>&1 &
                fi
                unset GIT_CONFIG_GLOBAL GIT_CONFIG_NOSYSTEM
                # Tracked ~/.gitconfig is reset by the background dotfiles update; keep pod settings in its untracked include.
                git config --file "$HOME/.gitconfig.identity.local" --replace-all user.name 'Bryan Smith'
                git config --file "$HOME/.gitconfig.identity.local" --replace-all user.email 'bryan@bry-guy.net'
                git config --file "$HOME/.gitconfig.identity.local" --replace-all credential.helper /usr/local/bin/pi-ez-web-git-credential-helper
            - name: PORT
              value: "3141"
            - name: PI_WEB_MODE
              value: real
            # The selfhost pi-sync endpoint is non-secret; keep sync disabled
            # for automatic enrollment until the staged CLI/web transfer test.
            - name: PI_SYNC_SERVER_URL
              value: http://pi-syncd.pi-sync.svc:8080
            # Name shown to other pi-sync clients; the pod name changes every deploy.
            - name: PI_SYNC_DEVICE_LABEL
              value: web
            - name: PI_WEB_SYNC_ALL_CONVERSATIONS
              value: "false"
            # Projects run in per-project workers via workspaced; chats stay here.
            - name: PI_WEB_WORKSPACED_URL
              value: http://pi-workspaced.pi-workspaced.svc:3150
          ports:
            - name: http
              containerPort: 3141
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: state
              mountPath: /data
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: pi-ez-web-state-local
