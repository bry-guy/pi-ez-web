name: Publish pi-ez-web image

on:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: write
  packages: write

concurrency:
  group: pi-ez-web-${{ startsWith(github.ref_name, 'feature/') && 'preview' || github.ref_name }}
  cancel-in-progress: ${{ startsWith(github.ref_name, 'feature/') }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source revision and image tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$GITHUB_REF_NAME"
          source_sha="$(git rev-parse HEAD)"
          slug="$(printf '%s' "$source_ref" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed 's/-$//')"
          slug="${slug:-ref}"
          if [[ "$source_ref" == main ]]; then
            tag="sha-${source_sha:0:12}"
          else
            tag="branch-${slug}-${source_sha:0:12}"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$tag" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "Building $source_ref at $source_sha as $tag"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pi-ez-web
          tags: type=raw,value=${{ steps.source.outputs.tag }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PI_WEB_BUILD_ID=${{ steps.source.outputs.sha }}

      - name: Update deployment digest
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            python3 scripts/update-image-digest.py \
              ghcr.io/${{ github.repository_owner }}/pi-ez-web \
              "$digest"
          else
            python3 - "$digest" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path("deploy/k8s-preview/kustomization.yaml")
          digest = sys.argv[1]
          text = path.read_text()
          pattern = r'  - name: ghcr\.io/bry-guy/pi-ez-web\n(?:    newTag: [^\n]+|    newName: ghcr\.io/bry-guy/pi-ez-web\n    digest: [^\n]+)'
          replacement = f'  - name: ghcr.io/bry-guy/pi-ez-web\n    newName: ghcr.io/bry-guy/pi-ez-web\n    digest: {digest}'
          updated, count = re.subn(pattern, replacement, text)
          if count != 1:
              raise SystemExit("expected one pi-ez-web preview image entry")
          path.write_text(updated)
          PY
          fi

      - name: Commit deployment digest
        run: |
          if [[ "$GITHUB_REF_NAME" == main ]]; then
            target=deploy/k8s/kustomization.yaml
          else
            target=deploy/k8s-preview/kustomization.yaml
          fi
          if git diff --quiet -- "$target"; then
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add "$target"
          git commit -m "chore(deploy): update ${GITHUB_REF_NAME} image digest [skip ci]"
          git push

      - name: Advance preview pointer
        if: startsWith(github.ref_name, 'feature/')
        shell: bash
        run: |
          set -euo pipefail
          # Do not let an older build win if the feature branch moved while
          # this image was building. The newest workflow run will advance it.
          branch_sha="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 { print $1 }')"
          if [[ "$branch_sha" != "$(git rev-parse HEAD)" ]]; then
            echo "${GITHUB_REF_NAME} advanced during the build; leaving preview/pi unchanged"
            exit 0
          fi
          git push --force origin HEAD:refs/heads/preview/pi
          echo "Advanced preview/pi to ${GITHUB_SHA}"
