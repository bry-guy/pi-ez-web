name: Publish pi-ez-web image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - public/**
      - server/**
      - scripts/update-image-digest.py
      - .github/workflows/publish-image.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: pi-ez-web-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pi-ez-web
          tags: |
            type=raw,value=sha-${{ github.sha }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PI_WEB_BUILD_ID=${{ github.sha }}

      - name: Update deployment digest
        run: |
          python3 scripts/update-image-digest.py \
            ghcr.io/${{ github.repository_owner }}/pi-ez-web \
            "${{ steps.build.outputs.digest }}"

      - name: Commit deployment digest
        run: |
          if git diff --quiet -- deploy/k8s/kustomization.yaml; then
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add deploy/k8s/kustomization.yaml
          git commit -m "chore(deploy): update pi-ez-web image digest [skip ci]"
          git push
