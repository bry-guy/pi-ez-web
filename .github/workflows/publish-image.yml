name: Publish pi-ez-web image

on:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: write
  packages: write

concurrency:
  group: pi-ez-web-${{ github.ref_name == 'main' && 'main' || 'preview' }}
  cancel-in-progress: ${{ startsWith(github.ref_name, 'feature/') }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source revision and image tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$GITHUB_REF_NAME"
          source_sha="$(git rev-parse HEAD)"
          slug="$(printf '%s' "$source_ref" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed 's/-$//')"
          slug="${slug:-ref}"
          if [[ "$source_ref" == main ]]; then
            tag="sha-${source_sha:0:12}"
          else
            tag="branch-${slug}-${source_sha:0:12}"
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$tag" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "Building $source_ref at $source_sha as $tag"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pi-ez-web
          tags: type=raw,value=${{ steps.source.outputs.tag }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PI_WEB_BUILD_ID=${{ steps.source.outputs.sha }}

      - name: Stage image in preview
        id: preview
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          remote_source="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 { print $1 }')"
          if [[ "$remote_source" != "$SOURCE_SHA" ]]; then
            echo "$GITHUB_REF_NAME moved after this build started" >&2
            exit 1
          fi

          git checkout --detach "$SOURCE_SHA"
          python3 scripts/update-image-digest.py \
            deploy/k8s-preview/kustomization.yaml \
            ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pi-ez-web \
            "$DIGEST"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add deploy/k8s-preview/kustomization.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(deploy): stage $GITHUB_REF_NAME in preview [skip ci]"
          fi
          preview_commit="$(git rev-parse HEAD)"
          for _ in $(seq 1 12); do
            previous="$(git ls-remote origin refs/heads/preview/pi | awk 'NR == 1 { print $1 }')"
            if git push --force-with-lease="refs/heads/preview/pi:$previous" \
              origin "$preview_commit:refs/heads/preview/pi"; then
              echo "commit=$preview_commit" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "Could not update preview/pi" >&2
          exit 1

      - name: Connect to preview tailnet
        if: github.ref_name == 'main'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: ${{ vars.TAILSCALE_TAGS || 'tag:platform' }}

      - name: Verify preview artifact
        if: github.ref_name == 'main'
        shell: bash
        env:
          EXPECTED_BUILD: ${{ steps.source.outputs.sha }}
          PREVIEW_COMMIT: ${{ steps.preview.outputs.commit }}
          PREVIEW_URL: ${{ vars.PI_EZ_WEB_PREVIEW_URL || 'https://pi.preview.bry-guy.net' }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 90); do
            pointer="$(git ls-remote origin refs/heads/preview/pi | awk 'NR == 1 { print $1 }')"
            if [[ "$pointer" != "$PREVIEW_COMMIT" ]]; then
              git push --force-with-lease="refs/heads/preview/pi:$pointer" \
                origin "$PREVIEW_COMMIT:refs/heads/preview/pi" || true
            fi

            body="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              "$PREVIEW_URL/ui-health?build=$EXPECTED_BUILD" || true)"
            if BODY="$body" EXPECTED_BUILD="$EXPECTED_BUILD" python3 -c \
              'import json, os, sys; value = json.loads(os.environ["BODY"]); sys.exit(0 if value.get("ok") is True and value.get("buildId") == os.environ["EXPECTED_BUILD"] else 1)' \
              2>/dev/null; then
              echo "Preview is serving $EXPECTED_BUILD"
              exit 0
            fi
            sleep 10
          done
          echo "Preview did not serve $EXPECTED_BUILD within 15 minutes" >&2
          exit 1

      - name: Promote verified image to production
        if: github.ref_name == 'main'
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')"
          if [[ "$remote_main" != "$SOURCE_SHA" ]]; then
            echo "main moved before production promotion" >&2
            exit 1
          fi

          git checkout --detach "$SOURCE_SHA"
          python3 scripts/update-image-digest.py \
            deploy/k8s/kustomization.yaml \
            ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pi-ez-web \
            "$DIGEST"
          git add deploy/k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Production already references $DIGEST"
            exit 0
          fi
          git commit -m "chore(deploy): promote $SOURCE_SHA [skip ci]"
          git push origin HEAD:refs/heads/main
