name: Publish pi-ez-web image

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pi-ez-web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test

  publish:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source revision and image tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$GITHUB_REF_NAME"
          source_sha="$(git rev-parse HEAD)"
          tag="sha-${source_sha}"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$tag" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "Building $source_ref at $source_sha as $tag"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pi-ez-web
          tags: type=raw,value=${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PI_WEB_BUILD_ID=${{ steps.source.outputs.sha }}

  # Push to feature/** deploys the preview UI; push to main deploys preview, then production.
  # Digests are committed to main under deploy/k8s, which Argo CD syncs.
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: pi-ez-web-deploy
      cancel-in-progress: false
    env:
      SHA: ${{ needs.publish.outputs.sha }}
      DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate digest
        run: '[[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$SHA" =~ ^[0-9a-f]{40}$ ]]'

      # Preview and production hostnames are tailnet-only.
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TAILSCALE_FEDERATED_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_FEDERATED_AUDIENCE }}
          tags: tag:ci

      - name: Deploy preview
        run: scripts/deploy.sh preview

      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        run: scripts/deploy.sh production
