name: Publish pi-ez-web image

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pi-ez-web-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source revision and image tag
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_ref="$GITHUB_REF_NAME"
          source_sha="$(git rev-parse HEAD)"
          tag="sha-${source_sha}"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$tag" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "Building $source_ref at $source_sha as $tag"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pi-ez-web
          tags: type=raw,value=${{ steps.source.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PI_WEB_BUILD_ID=${{ steps.source.outputs.sha }}
